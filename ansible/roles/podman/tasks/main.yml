---
- name: Install Podman and dependencies
  "ansible.builtin.apt":
    name:
      - uidmap
      - fuse-overlayfs
      - slirp4netns
      - systemd-container
      - podman
      - passt
    state: present
    update_cache: true

- name: Enable and start Podman auto-update
  ansible.builtin.systemd:
    name: podman-auto-update.timer
    enabled: true
    state: started
